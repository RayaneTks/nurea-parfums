<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F2F7">
<title>Pas de connexion — Nuréa Gestion</title>
<!--
  E09 — page hors ligne autonome (04 §14.4, 06 E09).

  Servie par le service worker quand une navigation échoue ou reste 10 s sans réponse. Elle est
  pré-cachée à l'installation et doit donc s'afficher des mois plus tard, sans réseau : AUCUNE
  ressource externe, aucun bundle, aucune police à télécharger. Les couleurs sont celles de
  `src/design/tokens.ts`, recopiées à la main — c'est le seul endroit du dépôt où c'est permis.

  Hors du matcher de `proxy.ts` (`/admin/:path*`) : le pré-cache ne suit jamais une redirection vers
  l'écran de connexion, qui devenait le repli hors ligne dans l'existant (01 §4.7).
-->
<style>
  html, body { margin: 0; min-height: 100%; background: #F2F2F7; color: #111114; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    box-sizing: border-box;
  }
  main { width: 100%; max-width: 420px; background: #FFFFFF; border-radius: 14px; padding: 28px 24px; text-align: center; }
  h1 { margin: 0 0 12px; font-size: 22px; line-height: 1.25; font-weight: 700; color: #7B0B1D; }
  p { margin: 0 0 20px; font-size: 16px; line-height: 1.45; color: #5F5862; }
  #brouillon {
    display: none; margin: 0 0 20px; padding: 12px 14px; border-radius: 12px;
    background: rgba(123, 11, 29, 0.08); color: #111114; font-size: 15px; line-height: 1.4;
  }
  button {
    display: block; width: 100%; min-height: 44px; min-width: 44px; padding: 12px 20px; border: 0; border-radius: 12px;
    background: #7B0B1D; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #7B0B1D; outline-offset: 2px; }
</style>
</head>
<body>
<main>
<h1>Pas de connexion</h1>
<p>Les données de gestion sont toujours lues en direct. Reconnecte-toi au réseau pour continuer.</p>
<p id="brouillon">Ton ticket en cours est gardé sur ce téléphone.</p>
<button type="button" onclick="location.reload()">Réessayer</button>
</main>
<script>
/*
 * Le brouillon du composeur (04 §3.7, `src/app-shell/hooks/draft-store.ts`) : même clé, même format,
 * même durée de vie. La ligne n'apparaît que si un ticket est VRAIMENT en cours — une ligne toujours
 * affichée serait une promesse invérifiable (02 §8).
 */
(function () {
  var KEY = "nurea:brouillon:vendre";
  var TTL = 24 * 60 * 60 * 1000;
  try {
    var raw = window.localStorage.getItem(KEY);
    if (!raw) return;
    var parsed = JSON.parse(raw);
    if (!parsed || parsed.v !== 1 || typeof parsed.savedAt !== "number") return;
    if (Date.now() - parsed.savedAt > TTL) return;
    document.getElementById("brouillon").style.display = "block";
  } catch (e) {
    /* stockage refusé ou brouillon illisible : on ne promet rien. */
  }
})();
</script>
</body>
</html>
