<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Refonte des visuels Nuréa</title>
<style>
  :root {
    --bg: #f2f3f5; --surface: #ffffff; --sunken: #eceef1; --text: #15171c; --muted: #6a7080;
    --line: #e2e5ea; --accent: #2563eb; --on-accent: #ffffff;
    --todo: #dc2626; --todo-bg: #fdecec; --create: #7c3aed; --create-bg: #f1ebfe;
    --done: #16a34a; --done-bg: #e7f6ec; --warn: #8a5a00; --warn-bg: #fff4dc;
    --paper: #ffffff; --overlay: rgba(10, 12, 16, .94); --shadow: 0 1px 2px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1115; --surface: #1a1d23; --sunken: #23272f; --text: #eef0f4; --muted: #9aa1ae;
      --line: #2c313a; --accent: #6b9bff; --on-accent: #0b1020;
      --todo: #ff7b72; --todo-bg: #3a1c1b; --create: #b49bff; --create-bg: #2a2342;
      --done: #5fd38a; --done-bg: #16301f; --warn: #f2c063; --warn-bg: #352a12; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115; --surface: #1a1d23; --sunken: #23272f; --text: #eef0f4; --muted: #9aa1ae;
    --line: #2c313a; --accent: #6b9bff; --on-accent: #0b1020;
    --todo: #ff7b72; --todo-bg: #3a1c1b; --create: #b49bff; --create-bg: #2a2342;
    --done: #5fd38a; --done-bg: #16301f; --warn: #f2c063; --warn-bg: #352a12; --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); }
  body { color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* En-tête collant : progression, recherche, onglets */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 10px; max-width: 720px; margin: 0 auto; }
  .t1 { display: flex; align-items: center; gap: 12px; }
  .t1 h1 { font-size: 22px; margin: 0; flex: 1; }
  .count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .gear { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--muted); font-size: 20px; }
  .prog { height: 6px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--done); border-radius: 99px; transition: width .3s ease-out; }
  .search { position: relative; }
  .search input { width: 100%; height: 42px; border: 0; background: var(--sunken); border-radius: 12px; padding: 0 40px 0 38px; font-size: 16px; }
  .search input::placeholder { color: var(--muted); }
  .search::before { content: "⌕"; position: absolute; left: 12px; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 20px; pointer-events: none; }
  .search button { position: absolute; right: 2px; top: 1px; width: 40px; height: 40px; border: 0; background: none; color: var(--muted); font-size: 22px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--sunken); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; border-radius: 9px; min-height: 40px; font-size: 14px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; padding: 4px 2px; }
  .seg button b { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; opacity: .8; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .seg button[data-f="todo"][aria-pressed="true"] b { color: var(--todo); opacity: 1; }
  .seg button[data-f="creer"][aria-pressed="true"] b { color: var(--create); opacity: 1; }
  .seg button[data-f="fait"][aria-pressed="true"] b { color: var(--done); opacity: 1; }

  /* Liste */
  main { max-width: 720px; margin: 0 auto; padding: 4px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .list { background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 0; background: none; text-align: left; border-top: 1px solid var(--line); min-height: 72px; }
  .row:first-child { border-top: 0; }
  .row:active { background: var(--sunken); }
  .thumb { width: 44px; height: 60px; border-radius: 8px; overflow: hidden; flex: none; background: var(--sunken); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.ref { background: var(--paper); }
  .thumb.ref img { object-fit: contain; }
  .rt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .rt b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rt small { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .d-todo { background: var(--todo); } .d-creer { background: var(--create); } .d-fait, .d-ok { background: var(--done); }
  .chev { color: var(--muted); font-size: 22px; flex: none; margin-left: -4px; }
  .empty { text-align: center; color: var(--muted); padding: 56px 16px; font-size: 17px; }

  /* Fiche plein écran */
  .sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
  .sh-top { display: flex; align-items: center; gap: 6px; padding: calc(8px + env(safe-area-inset-top, 0px)) 8px 8px; background: var(--bg); }
  .back { width: 44px; height: 44px; border: 0; background: none; font-size: 30px; line-height: 1; color: var(--accent); flex: none; }
  .sh-title { flex: 1; min-width: 0; }
  .sh-title b { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sh-title small { color: var(--muted); font-size: 14px; }
  .sh-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 14px; max-width: 720px; width: 100%; margin: 0 auto; }
  .shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .shot { border: 0; padding: 0; background: none; display: flex; flex-direction: column; gap: 4px; align-items: stretch; min-width: 0; }
  .shot .img { aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; background: var(--sunken); display: grid; place-items: center; position: relative; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot.ref .img { background: var(--paper); }
  .shot.ref img { object-fit: contain; padding: 4px; }
  .shot .lbl { font-size: 13px; color: var(--muted); text-align: center; }
  .shot .flag { position: absolute; top: 6px; right: 6px; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }
  .shot.todo-shot .img { box-shadow: inset 0 0 0 2px var(--todo); }
  .shot.new .img { border: 2px dashed var(--create); background: var(--create-bg); color: var(--create); font-size: 30px; }
  .fix { background: var(--todo-bg); border-radius: 12px; padding: 12px 14px; }
  .fix ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
  .fix .tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--todo); text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 4px; }
  .fix .tag:first-child { margin-top: 0; }
  .warn { background: var(--warn-bg); color: var(--text); border-radius: 12px; padding: 10px 14px; font-size: 15px; margin: 0; }
  .fields { display: flex; flex-direction: column; gap: 12px; }
  .fields label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .fields textarea, .fields input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; font-size: 16px; font-weight: 400; color: var(--text); }
  .fields textarea { min-height: 64px; resize: vertical; line-height: 1.4; }
  .fields textarea::placeholder, .fields input::placeholder { color: var(--muted); opacity: .55; }
  .fields .astuce { margin: 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
  .rt small .relire { color: var(--warn); font-weight: 600; }
  .fields details { background: var(--surface); border-radius: 12px; padding: 0 14px; border: 1px solid var(--line); }
  .fields summary { min-height: 48px; display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); cursor: pointer; list-style: none; }
  .fields summary::-webkit-details-marker { display: none; }
  .fields summary::after { content: "›"; margin-left: auto; font-size: 20px; transition: transform .15s; }
  .fields details[open] summary::after { transform: rotate(90deg); }
  .fields details[open] { padding-bottom: 14px; }
  .fields details label { margin-top: 8px; }
  .apercu { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; }
  .apercu summary { min-height: 48px; display: flex; align-items: center; font-size: 15px; color: var(--accent); font-weight: 600; cursor: pointer; list-style: none; }
  .apercu summary::-webkit-details-marker { display: none; }
  .apercu summary::after { content: "›"; margin-left: auto; font-size: 20px; color: var(--muted); transition: transform .15s; }
  .apercu[open] summary::after { transform: rotate(90deg); }
  .apercu pre { margin: 0 0 14px; white-space: pre-wrap; word-break: break-word; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--sunken); border-radius: 10px; padding: 12px; }
  .photo { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--accent); font-weight: 600; text-decoration: none; }
  .fallback { width: 100%; min-height: 180px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 13px; background: var(--surface); }
  .sh-bar { display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
  .sh-bar.solo { grid-template-columns: 1fr; }
  .sh-bar.duo { grid-template-columns: 1fr 1fr; }
  .sh-bar.duo .b-done { grid-column: 1 / -1; }
  .big { min-height: 52px; border-radius: 14px; border: 0; font-size: 17px; font-weight: 700; }
  .b-copy { background: var(--accent); color: var(--on-accent); }
  .b-copy.ok { background: var(--done); color: #fff; }
  .b-done { background: var(--done-bg); color: var(--done); }
  .b-done[aria-pressed="true"] { background: var(--done); color: #fff; }
  .modele textarea { width: 100%; min-height: 60vh; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.4; }
  .b-ghost { background: var(--sunken); color: var(--text); }

  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 15px; z-index: 60; max-width: calc(100% - 32px); text-align: center; }

  /* Visionneuse */
  .viewer { position: fixed; inset: 0; z-index: 50; background: var(--overlay); color: #fff; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .v-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; }
  .v-open { color: #fff; font-size: 15px; font-weight: 600; text-decoration: none; padding: 12px 14px; border-radius: 99px; background: rgba(255,255,255,.14); min-height: 44px; display: inline-flex; align-items: center; }
  .v-open[hidden] { display: none; }
  .v-close { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; font-size: 24px; }
  .v-stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); place-items: center; padding: 0 12px; touch-action: none; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .v-stage img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; transform-origin: 50% 50%; will-change: transform; -webkit-user-drag: none; }
  .v-stage img.ref { background: #fff; }
  .v-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 12px; }
  .v-tabs button { height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: none; color: #fff; font-size: 15px; font-weight: 600; }
  .v-tabs button[aria-pressed="true"] { background: #fff; color: #111; }
  .v-tabs button[disabled] { opacity: .3; }
  @media (prefers-reduced-motion: reduce) { .prog i, .fields summary::after { transition: none; } }
</style>

<header class="top">
  <div class="t1"><h1>Visuels</h1><span class="count" id="count"></span><button type="button" class="gear" id="gear" aria-label="Modèle de prompt">⚙</button></div>
  <div class="prog" aria-hidden="true"><i id="prog"></i></div>
  <div class="search">
    <input id="q" type="search" placeholder="Rechercher" autocomplete="off" enterkeyhint="search" aria-label="Rechercher un parfum ou une marque">
    <button type="button" id="q-clear" aria-label="Effacer" hidden>×</button>
  </div>
  <nav class="seg" id="seg" aria-label="Catégories"></nav>
</header>

<main><div id="list"><p class="empty">Chargement…</p></div></main>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sh-top"><button type="button" class="back" id="sh-back" aria-label="Retour">‹</button><div class="sh-title" id="sh-title"></div></div>
  <div class="sh-body" id="sh-body"></div>
  <div class="sh-bar" id="sh-bar"></div>
</section>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Image agrandie" hidden>
  <div class="v-top"><span></span><button type="button" class="v-close" id="v-close" aria-label="Fermer">×</button></div>
  <div class="v-stage" id="v-stage"><img id="v-img" alt="" referrerpolicy="no-referrer" draggable="false"></div>
  <div class="v-tabs" id="v-tabs">
    <button type="button" data-k="ref">Original</button>
    <button type="button" data-k="dark">Sombre</button>
    <button type="button" data-k="light">Clair</button>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="text/plain" id="modele-origine">Generate a perfume product photo on a canvas of exactly 900×1200 pixels (portrait 3:4 ratio).

STRICT LAYOUT RULES (do not deviate):
- The perfume bottle must be centered horizontally, with its base resting at 85–90% of the image height (around y=1050px). The bottle height should be 500–620px tall.
- The upper 40% of the image (above y=480px) is dedicated to the background ambiance: lighting, textures, materials, atmosphere. No bottle in this zone.
- Bottom-left corner: reserve a 120×80px area (x:0–120, y:1080–1200) for a small logo placement — keep this zone clean with no busy details.
- No text, no watermarks, no price tags.

BOTTLE — reproduce exactly the real [NOM DU PARFUM] bottle by [MARQUE], as sold today. Do not invent, add or remove any detail, text or ornament:
- [Description du flacon]

STYLE BRIEF — [NOM DU PARFUM] by [MARQUE]:
- [Décrire l'univers : ex. "dark masculine woody oud — deep mahogany tones, amber candlelight glow, black velvet texture in background"]
- [Couleur dominante : ex. "deep burgundy and gold accents"]
- [Ambiance : ex. "editorial luxury, cinematic lighting, soft shadows"]
- [Matériaux au fond : ex. "cracked dark marble, draped silk fabric, rose petals"]

TECHNICAL:
- Ultra-sharp product photography style
- Professional studio lighting with dramatic shadows
- Bottle must be perfectly in focus, photorealistic
- Background out of focus (bokeh) to keep bottle as hero
- No busy patterns that would conflict with the bottle silhouette</script>

<script>
(async () => {
  // Les données (et les vignettes) sont dans le bloc JSON de la page.
  const DATA = JSON.parse(document.getElementById("data").textContent);
  // Tour de contrôle : changer ce numéro remet toutes les coches « fait » à zéro.
  const ROUND = "r2";
  const SHORT = { ref: "Original", dark: "Sombre", light: "Clair" };
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const doneKey = (p, k) => `fait-${ROUND}-${p.id}-${k}${p.updated ? "-" + p.updated.replace("/", "") : ""}`;
  const isDone = (p, k) => ls.get(doneKey(p, k)) === "1";
  const byId = (id) => DATA.find((x) => String(x.id) === String(id));
  const emb = (p, k) => (k === "ref" ? p.refs?.[0]?.img : p[k + "Img"]) || null;
  const imgOf = (p, k) => emb(p, k) || p.urls?.[k] || null;
  // Pleine qualité : le visuel en ligne (vignette 640 px dans les fiches, original dans la visionneuse) ; la miniature intégrée sert de secours.
  const hq = (p, k) => p.urls?.[k] || imgOf(p, k);
  document.addEventListener("error", (e) => {
    const t = e.target; if (!t || t.tagName !== "IMG" || !t.dataset.pid) return;
    const p = byId(t.dataset.pid), k = t.dataset.k, u = p?.urls?.[k], step = Number(t.dataset.step || 0);
    if (!p) return;
    if (step === 0 && u && t.src !== u) { t.dataset.step = "1"; t.src = u; }
    else if (step < 2) { t.dataset.step = "2"; const m = emb(p, k); if (m) t.src = m; }
  }, true);
  const needs = (p) => ["dark", "light"].filter((k) => p[k]?.verdict === "A_REFAIRE");
  const doneKeys = (p) => (p.kind === "sans" ? ["sans"] : needs(p));
  const fini = (p) => { const ks = doneKeys(p); return ks.length > 0 && ks.every((k) => isDone(p, k)); };
  function setFini(p, on) { for (const k of doneKeys(p)) ls.set(doneKey(p, k), on ? "1" : null); }

  // Une seule catégorie par parfum.
  function status(p) {
    if (fini(p)) return "fait";
    if (p.kind === "sans") return "creer";
    return needs(p).length ? "todo" : "ok";
  }
  const TABS = [{ f: "todo", label: "À refaire" }, { f: "creer", label: "À créer" }, { f: "fait", label: "Faits" }, { f: "all", label: "Tout" }];
  let tab = ls.get("refonte-onglet") || "todo";
  if (!TABS.some((t) => t.f === tab)) tab = "todo";
  let q = "";
  const inTab = (p, f) => f === "all" || status(p) === f;

  function head() {
    $("seg").innerHTML = TABS.map((t) => `<button type="button" data-f="${t.f}" aria-pressed="${t.f === tab}">${t.label}<b>${DATA.filter((p) => inTab(p, t.f)).length}</b></button>`).join("");
    const travail = DATA.filter((p) => status(p) !== "ok");
    const faits = travail.filter((p) => status(p) === "fait").length;
    $("count").textContent = `${faits} / ${travail.length}`;
    $("prog").style.width = `${travail.length ? (faits / travail.length) * 100 : 0}%`;
  }

  // Visuel de marque : la marque en titre, pas « Visuel de la marque ».
  const titre = (p) => (String(p.id).startsWith("marque-") ? [p.brand, "Visuel de la marque"] : [p.name, p.brand]);
  function row(p) {
    const st = status(p);
    const useRef = p.kind === "sans" || !p.darkImg;
    const src = useRef ? imgOf(p, "ref") : p.darkImg;
    return `<button type="button" class="row" data-open="${p.id}">
      <span class="thumb${useRef ? " ref" : ""}">${src ? `<img src="${src}" alt="" loading="lazy" decoding="async">` : ""}</span>
      <span class="rt"><b>${esc(titre(p)[0])}</b><small>${esc(titre(p)[1])}${p.nouveau ? " · nouveau" : ""}${p.rev ? ' · <span class="relire">à relire</span>' : ""}</small></span>
      <span class="dot d-${st}" aria-label="${{ todo: "À refaire", creer: "À créer", fait: "Fait", ok: "Validé" }[st]}"></span><span class="chev" aria-hidden="true">›</span>
    </button>`;
  }

  function render() {
    head();
    const nq = norm(q).trim();
    const items = DATA.filter((p) => inTab(p, tab) && (!nq || norm(`${p.brand} ${p.name}`).includes(nq)));
    $("list").innerHTML = items.length ? `<div class="list">${items.map(row).join("")}</div>`
      : `<p class="empty">${nq ? "Aucun résultat" : tab === "fait" ? "Rien encore" : "Tout est fait 🎉"}</p>`;
  }

  // Prompt à trous : chaque [crochet] du modèle devient une case ; nom, marque et flacon sont remplis d'office.
  const MODELE_ORIGINE = document.getElementById("modele-origine").textContent.trim();
  let modele = ls.get("refonte-modele") || MODELE_ORIGINE;
  function trous() {
    const seen = new Set(); const out = [];
    for (const m of modele.matchAll(/\[([^\]]+)\]/g)) {
      if (seen.has(m[1])) continue; seen.add(m[1]);
      const [label, ...rest] = m[1].split(/\s*:\s*/);
      const hint = rest.join(" : ").replace(/^ex\.\s*/i, "").replace(/^"|"$/g, "");
      const n = norm(label).trim();
      const auto = /nom du parfum|^nom$|^parfum$/.test(n) ? "name" : /^marque$|^brand$/.test(n) ? "brand" : /flacon|bottle/.test(n) ? "bottle" : null;
      let lib = label.trim().replace(/^d[ée]crire (l'|le |la )?/i, "");
      if (lib === lib.toUpperCase()) lib = lib.toLowerCase();
      out.push({ key: m[1], label: lib.replace(/^./, (c) => c.toUpperCase()), hint, auto });
    }
    return out;
  }
  // Rien n'est obligatoire. Les cases du designer vides : le prompt prêt de Claude (p.defaults) est utilisé.
  // Au moins une case remplie : le prompt ne porte que les instructions du designer, comme avant.
  const draftKey = (p) => `prompt-${p.id}`;
  function draft(p) { try { return JSON.parse(ls.get(draftKey(p)) || "{}"); } catch { return {}; } }
  // Quel champ de p.defaults correspond à quelle case du modèle (par le libellé ; un modèle modifié garde ses cases propres).
  function roleOf(t) {
    const n = norm(t.label);
    return /univers/.test(n) ? "univers" : /couleur/.test(n) ? "couleur" : /ambiance/.test(n) ? "ambiance" : /materiau/.test(n) ? "matieres" : null;
  }
  const defaut = (p, t) => (roleOf(t) && p.defaults?.[roleOf(t)]) || "";
  function auto(p, t) { return t.auto === "name" ? p.name : t.auto === "brand" ? p.brand : t.auto === "bottle" ? (p.bottleEn || "") : ""; }
  // Valeur affichée dans la case : celle du designer (brouillon), jamais celle de Claude (qui reste en indice grisé).
  function valeur(p, t, d) { return t.auto ? (d[t.key] ?? auto(p, t)) : (d[t.key] ?? ""); }
  const instructionsDuDesigner = (p, d) => trous().some((t) => !t.auto && (d[t.key] ?? "").trim());
  function champ(p, t, i, d) {
    const val = esc(valeur(p, t, d));
    const input = t.auto === "name" || t.auto === "brand" ? `<input data-trou="${i}" value="${val}">`
      : `<textarea data-trou="${i}" rows="${t.auto ? 5 : 3}" placeholder="${esc(defaut(p, t) || t.hint)}">${val}</textarea>`;
    return `<label><span>${esc(t.label)}</span>${input}</label>`;
  }
  function saveDraft(p) {
    const ts = trous(); const d = draft(p);
    for (const el of $("sh-body").querySelectorAll("[data-trou]")) { const t = ts[Number(el.dataset.trou)]; if (t) d[t.key] = el.value; }
    ls.set(draftKey(p), JSON.stringify(d));
  }
  function promptText(p) {
    const ts = trous(); const d = draft(p); const lignes = [];
    const duDesigner = instructionsDuDesigner(p, d);
    const val = (t) => (t.auto ? valeur(p, t, d) : duDesigner ? (d[t.key] ?? "") : defaut(p, t)).trim();
    for (const ligne of modele.split("\n")) {
      let l = ligne, videe = false;
      for (const t of ts) if (l.includes(`[${t.key}]`)) { const v = val(t); if (!v) videe = true; l = l.split(`[${t.key}]`).join(v); }
      if (videe && /^[\s\-–—:•]*$/.test(l)) continue;
      lignes.push(l);
    }
    return lignes.join("\n");
  }
  const chercherPhoto = (p) => `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(`${p.brand} ${p.name} parfum flacon`)}`;

  // Fiche plein écran
  let cur = null;
  function shot(p, k) {
    if (k !== "ref" && p.kind === "sans") return `<div class="shot new"><span class="img">+</span><span class="lbl">${SHORT[k]}</span></div>`;
    const src = imgOf(p, k); const v = k === "ref" ? null : p[k];
    if (k !== "ref" && !v) return `<div class="shot new"><span class="img">+</span><span class="lbl">${SHORT[k]}</span></div>`;
    const bad = v?.verdict === "A_REFAIRE" && !isDone(p, k);
    return `<button type="button" class="shot${k === "ref" ? " ref" : ""}${bad ? " todo-shot" : ""}" data-view="${k}" ${src ? "" : "disabled"} aria-label="Agrandir : ${SHORT[k]}">
      <span class="img">${src ? `<img src="${hq(p, k, false)}" data-pid="${esc(p.id)}" data-k="${k}" referrerpolicy="no-referrer" alt="">` : ""}${v ? `<span class="flag d-${bad ? "todo" : "fait"}"></span>` : ""}</span><span class="lbl">${SHORT[k]}</span></button>`;
  }
  function fixes(p) {
    const n = needs(p); if (!n.length) return "";
    const same = n.length === 2 && JSON.stringify(p.dark.fix) === JSON.stringify(p.light.fix);
    const groups = same ? [[null, p.dark.fix]] : n.map((k) => [SHORT[k], p[k].fix]);
    return `<div class="fix">${groups.map(([tag, fx]) => `${tag ? `<span class="tag">${tag}</span>` : ""}<ul>${fx.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`).join("")}</div>`;
  }
  function correction(p) {
    const bloc = (k) => [`Retouche ce visuel de ${p.brand} ${p.name} (version ${k === "dark" ? "sombre" : "claire"}) :`, ...p[k].fix.map((x) => `- ${x}`), "Ne change rien d'autre : garde le décor, la lumière et le cadrage."].join("\n");
    return needs(p).map(bloc).join("\n\n");
  }
  // Photo d'origine en grand (Fragrantica), à enregistrer et joindre à la génération.
  const photoUrl = (p) => p.refs?.[0]?.big || (p.refs?.[0]?.fid ? `https://fimgs.net/mdimg/perfume/o.${p.refs[0].fid}.jpg` : null);
  function apercus(p) {
    const bloc = (titre, txt, id) => `<details class="apercu"><summary>${titre}</summary><pre${id ? ` id="${id}"` : ""}>${esc(txt)}</pre></details>`;
    const photo = photoUrl(p) ? `<a class="photo" href="${photoUrl(p)}" target="_blank" rel="noopener noreferrer">Photo du flacon en grand ↗</a>`
      : p.kind === "sans" ? `<a class="photo" href="${chercherPhoto(p)}" target="_blank" rel="noopener noreferrer">Chercher la photo du flacon ↗</a>` : "";
    if (status(p) === "ok") return "";
    if (p.kind === "sans") return bloc("Voir le prompt", promptText(p), "apercu-prompt") + photo;
    return bloc("Voir la correction", correction(p)) + photo;
  }
  function bar(p) {
    const st = status(p);
    if (st === "ok") return { cls: "solo", html: `<button type="button" class="big b-done" aria-pressed="true" disabled>✓ Validé</button>` };
    const done = fini(p);
    const fait = `<button type="button" class="big b-done" id="b-done" aria-pressed="${done}">${done ? "✓ Fait" : "Fait"}</button>`;
    if (p.kind === "sans") return { cls: "", html: `<button type="button" class="big b-copy" data-copy="prompt">Copier le prompt</button>${fait}` };
    return { cls: "", html: `<button type="button" class="big b-copy" data-copy="correction">Copier la correction</button>${fait}` };
  }
  function openSheet(p, push = true) {
    cur = p;
    $("sh-title").innerHTML = `<b>${esc(titre(p)[0])}</b><small>${esc(titre(p)[1])}</small>`;
    const ts = trous(); const d = draft(p); const idx = ts.map((t, i) => [t, i]);
    const libres = idx.filter(([t]) => !t.auto), remplis = idx.filter(([t]) => t.auto);
    const avecPrompt = p.kind === "sans";
    $("sh-body").innerHTML = `
      <div class="shots">${shot(p, "ref")}${shot(p, "dark")}${shot(p, "light")}</div>
      ${fixes(p)}
      ${p.nouveau ? `<p class="warn">Nouvelle référence : pas encore de photo ici. Cherche le vrai flacon (lien en bas), enregistre la photo et joins-la à la génération.</p>` : ""}
      ${p.rev ? `<p class="warn">Les notes de ce parfum n'ont pas pu être vérifiées. Relis l'univers proposé avant de générer.</p>` : ""}
      ${p.warn ? `<p class="warn">${esc(p.warn)}</p>` : ""}
      ${avecPrompt ? `<div class="fields">
        <p class="astuce">Cases vides : le prompt prêt de Claude est utilisé (en gris). Remplis une case : seules tes instructions comptent.</p>
        ${libres.map(([t, i]) => champ(p, t, i, d)).join("")}
        ${remplis.length ? `<details><summary>✓ ${remplis.map(([t]) => esc(t.label)).join(" · ")}</summary>${remplis.map(([t, i]) => champ(p, t, i, d)).join("")}</details>` : ""}
      </div>` : ""}${apercus(p)}<div id="fallback"></div>`;
    const b = bar(p);
    $("sh-bar").className = "sh-bar" + (b.cls ? " " + b.cls : "");
    $("sh-bar").innerHTML = b.html;
    $("sheet").hidden = false; document.body.style.overflow = "hidden"; $("sh-body").scrollTop = 0;
    if (push) history.pushState({ sheet: 1 }, "");
  }
  function closeSheet(fromHistory) {
    if ($("sheet").hidden) return;
    $("sheet").hidden = true; document.body.style.overflow = ""; cur = null; render();
    if (!fromHistory && history.state?.sheet) history.back();
  }

  let tt;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 1800); }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      const t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
      document.body.append(t); t.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch {}
      t.remove(); return ok;
    }
  }

  $("sh-body").addEventListener("input", (e) => {
    if (e.target.dataset.trou === undefined || !cur) return;
    saveDraft(cur);
    const ap = $("apercu-prompt"); if (ap) ap.textContent = promptText(cur);
  });
  $("sh-body").addEventListener("click", (e) => { const b = e.target.closest("[data-view]"); if (b && cur) openViewer(cur, b.dataset.view); });
  $("sh-bar").addEventListener("click", async (e) => {
    const p = cur; if (!p) return;
    if (e.target.closest("#b-done")) {
      const on = !fini(p); setFini(p, on); openSheet(p, false); head();
      toast(on ? "✓ Fait" : "Remis à faire");
      return;
    }
    const cb = e.target.closest("[data-copy]");
    if (cb && cb.dataset.copy === "correction") {
      const txt = correction(p); const ok = await copy(txt);
      if (ok) { cb.classList.add("ok"); cb.textContent = "✓ Copié"; setTimeout(() => { cb.classList.remove("ok"); cb.textContent = "Copier la correction"; }, 1800); $("fallback").innerHTML = ""; }
      else { $("fallback").innerHTML = `<textarea class="fallback" readonly>${esc(txt)}</textarea>`; const f = $("fallback").firstChild; f.focus(); f.select(); f.scrollIntoView({ block: "center" }); }
      return;
    }
    if (cb) {
      saveDraft(p);
      const txt = promptText(p); const ok = await copy(txt); const b = cb;
      if (ok) { b.classList.add("ok"); b.textContent = "✓ Copié"; setTimeout(() => { b.classList.remove("ok"); b.textContent = "Copier le prompt"; }, 1800); $("fallback").innerHTML = ""; }
      else { $("fallback").innerHTML = `<textarea class="fallback" readonly>${esc(txt)}</textarea>`; const f = $("fallback").firstChild; f.focus(); f.select(); f.scrollIntoView({ block: "center" }); }
    }
  });
  $("sh-back").addEventListener("click", () => closeSheet());

  // Visionneuse : Original / Sombre / Clair au même endroit pour comparer.
  let vp = null, vk = "ref";
  function show(k) {
    vk = k; const src = imgOf(vp, k);
    const img = $("v-img"); img.removeAttribute("data-step"); img.dataset.pid = vp.id; img.dataset.k = k;
    img.src = emb(vp, k) || src || "";
    const full = vp.urls?.[k];
    zoomReset(); if (full) { const pre = new Image(); pre.referrerPolicy = "no-referrer"; const me = vp; pre.onload = () => { if (vp === me && vk === k) img.src = full; }; pre.src = full; }
    img.className = k === "ref" ? "ref" : ""; img.alt = `${vp.name} — ${SHORT[k]}`;
    for (const b of $("v-tabs").children) { b.setAttribute("aria-pressed", String(b.dataset.k === k)); b.disabled = !imgOf(vp, b.dataset.k); }
  }
  function openViewer(p, k) { vp = p; show(k); $("viewer").hidden = false; history.pushState({ viewer: 1 }, ""); }
  function closeViewer(fromHistory) { if ($("viewer").hidden) return; $("viewer").hidden = true; if (!fromHistory && history.state?.viewer) history.back(); }
  const keys = () => ["ref", "dark", "light"].filter((k) => imgOf(vp, k));
  function step(d) { const ks = keys(); const i = ks.indexOf(vk); show(ks[(i + d + ks.length) % ks.length]); }
  $("v-close").addEventListener("click", () => closeViewer());
  $("v-tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b && !b.disabled) show(b.dataset.k); });
  $("v-stage").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeViewer(); });
  // Zoom : deux doigts (ou molette) pour agrandir, un doigt pour déplacer, double tap pour 3x / retour.
  let zs = 1, zx = 0, zy = 0;
  const zApply = () => { $("v-img").style.transform = zs === 1 ? "" : `translate(${zx}px, ${zy}px) scale(${zs})`; };
  function zoomReset() { zs = 1; zx = 0; zy = 0; zApply(); }
  function zoomAt(ns, cx, cy) {
    const r = $("v-stage").getBoundingClientRect(); const ox = cx - (r.left + r.width / 2), oy = cy - (r.top + r.height / 2);
    ns = Math.min(6, Math.max(1, ns)); const k = ns / zs;
    zx = ox - (ox - zx) * k; zy = oy - (oy - zy) * k; zs = ns;
    if (zs === 1) { zx = 0; zy = 0; } zApply();
  }
  const ptrs = new Map(); let pinch0 = null, lastTap = 0, moved = false;
  const stage = $("v-stage");
  stage.addEventListener("pointerdown", (e) => { stage.setPointerCapture?.(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = false;
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: zs }; } });
  stage.addEventListener("pointermove", (e) => {
    if (!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2 && pinch0) { const [a, b] = [...ptrs.values()]; moved = true; zoomAt(pinch0.s * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch0.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
    else if (ptrs.size === 1 && zs > 1) { moved = true; zx += e.clientX - prev[0]; zy += e.clientY - prev[1]; zApply(); }
  });
  const pEnd = (e) => {
    const wasOne = ptrs.size === 1; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null;
    if (wasOne && !moved && e.target.id === "v-img") { const now = Date.now(); if (now - lastTap < 320) { zoomAt(zs > 1 ? 1 : 3, e.clientX, e.clientY); lastTap = 0; } else lastTap = now; }
  };
  stage.addEventListener("pointerup", pEnd); stage.addEventListener("pointercancel", pEnd);
  stage.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(zs * (e.deltaY < 0 ? 1.25 : 0.8), e.clientX, e.clientY); }, { passive: false });
  let sx = null, sy = null;
  $("v-stage").addEventListener("touchstart", (e) => { if (e.touches.length === 1 && zs === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null; }, { passive: true });
  $("v-stage").addEventListener("touchend", (e) => {
    if (sx === null || zs > 1) { sx = null; return; } const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.5) closeViewer();
  });

  // Retour du téléphone : ferme d'abord la visionneuse, puis la fiche.
  window.addEventListener("popstate", () => { if (!$("viewer").hidden) closeViewer(true); else closeSheet(true); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("viewer").hidden) closeViewer(); else if (!$("sheet").hidden) closeSheet();
  });

  // Réglage du modèle : dans une fiche à part, derrière la roue.
  $("gear").addEventListener("click", () => {
    cur = null;
    $("sh-title").innerHTML = `<b>Modèle de prompt</b><small>Chaque [crochet] devient une case</small>`;
    $("sh-body").innerHTML = `<div class="modele"><textarea id="modele-txt" spellcheck="false" aria-label="Modèle de prompt">${esc(modele)}</textarea></div>`;
    $("sh-bar").className = "sh-bar";
    $("sh-bar").innerHTML = `<button type="button" class="big b-copy" id="m-save">Enregistrer</button><button type="button" class="big b-ghost" id="m-reset">D'origine</button>`;
    $("sheet").hidden = false; document.body.style.overflow = "hidden"; history.pushState({ sheet: 1 }, "");
    $("m-save").onclick = () => { modele = $("modele-txt").value.trim() || MODELE_ORIGINE; ls.set("refonte-modele", modele === MODELE_ORIGINE ? null : modele); toast("Enregistré"); closeSheet(); };
    $("m-reset").onclick = () => { modele = MODELE_ORIGINE; ls.set("refonte-modele", null); $("modele-txt").value = modele; toast("Modèle d'origine"); };
  });

  $("seg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.f; ls.set("refonte-onglet", tab); render(); window.scrollTo({ top: 0 }); });
  $("q").addEventListener("input", (e) => { q = e.target.value; $("q-clear").hidden = !q; render(); });
  $("q-clear").addEventListener("click", () => { q = ""; $("q").value = ""; $("q-clear").hidden = true; render(); });
  $("list").addEventListener("click", (e) => { const r = e.target.closest("[data-open]"); if (r) openSheet(byId(r.dataset.open)); });

  render();
})();
</script>

</body></html>
